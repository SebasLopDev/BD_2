name: bd2_distribuido

services:
  nodo_a:
    build: .
    container_name: nodo_a
    cap_add:
      - NET_ADMIN
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_a:/var/lib/postgresql
      - ./init-scripts/00-run-all.sh:/docker-entrypoint-initdb.d/00-run-all.sh:ro
      - ./init-scripts/common:/init-scripts/common:ro
      - ./init-scripts/nodo_a:/init-scripts/local:ro
    networks:
      pg_dist_net:
        ipv4_address: 172.25.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  nodo_b:
    build: .
    container_name: nodo_b
    cap_add:
      - NET_ADMIN
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    ports:
      - "5434:5432"
    volumes:
      - pgdata_b:/var/lib/postgresql
      - ./init-scripts/00-run-all.sh:/docker-entrypoint-initdb.d/00-run-all.sh:ro
      - ./init-scripts/common:/init-scripts/common:ro
      - ./init-scripts/nodo_b:/init-scripts/local:ro
    networks:
      pg_dist_net:
        ipv4_address: 172.25.0.20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  nodo_c:
    build: .
    container_name: nodo_c
    cap_add:
      - NET_ADMIN
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    ports:
      - "5435:5432"
    volumes:
      - pgdata_c:/var/lib/postgresql
      - ./init-scripts/00-run-all.sh:/docker-entrypoint-initdb.d/00-run-all.sh:ro
      - ./init-scripts/common:/init-scripts/common:ro
      - ./init-scripts/nodo_c:/init-scripts/local:ro
    networks:
      pg_dist_net:
        ipv4_address: 172.25.0.30
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  pg_dist_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24

volumes:
  pgdata_a:
  pgdata_b:
  pgdata_c:
